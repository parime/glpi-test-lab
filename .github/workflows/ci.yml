name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Scripts bash et sh
        run: |
          files=$(git ls-files lab '*.sh' compat/*.sh)
          echo "$files"
          # shellcheck disable=SC2086
          shellcheck --severity=style $files

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  stacks:
    name: fichiers de stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Validation (docker compose config)
        env:
          LAB_INSTANCE: ci
          LAB_GLPI_VERSION: 12.0.2
          LAB_PORT: "8101"
          LAB_DB_ROOT_PASSWORD: ci
          LAB_DB_PASSWORD: ci
        run: |
          set -e
          # Variables des briques : celles de .env.example, les vides (mots de passe) valant « ci » ;
          # empreintes et fichiers de secrets générés d'ordinaire par les crochets : factices.
          while IFS='=' read -r k v; do export "$k=${v:-ci}"; done < <(grep -E '^LAB_[A-Z0-9_]+=' .env.example)
          export LAB_DB_PASSWORD=ci LAB_DB_ROOT_PASSWORD=ci LAB_WUD8_GLPI_HASH=ci LAB_TRAEFIK_GLPI_HASH=ci
          export LAB_SECRETS_DIR="$PWD/secrets"
          for s in portainer/admin_password harbor/private_key.pem harbor/root.crt harbor/secretkey                    harbor/registry_passwd registry/htpasswd vaultwarden/cert.pem vaultwarden/key.pem; do
            mkdir -p "secrets/$(dirname "$s")"; echo ci > "secrets/$s"
          done
          : > ports.txt
          for f in stack/*.yml; do
            echo "== $f"
            docker compose -f "$f" config --quiet
            json=$(docker compose -f "$f" config --format json)
            # Taille au plus juste : chaque service a une limite de mémoire et de CPU, et une réservation.
            missing=$(echo "$json" | jq -r '.services | to_entries[] | select((.value.deploy.resources.limits.memory // "") == "" or (.value.deploy.resources.limits.cpus // "") == "" or (.value.deploy.resources.reservations.memory // "") == "") | .key')
            if [ -n "$missing" ]; then echo "::error file=$f::services sans limite ou réservation deploy.resources : $missing"; exit 1; fi
            # Ports publiés des briques : plage 8120-8199 (ceux des instances GLPI sont vérifiés plus bas).
            if [ "$f" != stack/glpi.yml ]; then
              echo "$json" | jq -r --arg f "$f" '.services[].ports[]?.published | "\(.) \($f)"' >> ports.txt
            fi
          done
          awk '$1 < 8120 || $1 > 8199 { print "::error file=" $2 "::port hors de la plage 8120-8199 : " $1; bad = 1 }
               seen[$1]++ { print "::error file=" $2 "::port publié deux fois : " $1; bad = 1 }
               END { exit bad }' ports.txt
      - name: Instances et profils
        run: |
          set -e
          # instances.txt : nom unique, version x.y.z, port unique dans 8100-8119, pas de nom de glpi-test-env.
          grep -vE '^[[:space:]]*(#|$)' instances.txt | awk '
            NF != 3 { print "ligne invalide : " $0; bad = 1 }
            $1 ~ /^g12[a-z]?$/ { print "nom réservé à glpi-test-env : " $1; bad = 1 }
            $2 !~ /^1[12]\.[0-9]+\.[0-9]+$/ { print "version invalide : " $2; bad = 1 }
            $3 < 8100 || $3 > 8119 { print "port hors plage : " $3; bad = 1 }
            seen[$1]++ { print "nom en double : " $1; bad = 1 }
            ports[$3]++ { print "port en double : " $3; bad = 1 }
            END { exit bad }'
          ./lab list
