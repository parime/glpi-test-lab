# Brique « traefik » : Traefik 3 et Traefik 2 (logiciels libres), fournisseur Swarm, pour le
# connecteur Traefik de l'Inventaire Docker (GET /api/version, /api/entrypoints,
# /api/http/routers, /api/http/services, /api/http/middlewares, /api/tcp/routers).
# Documentation : https://doc.traefik.io/traefik/reference/install-configuration/providers/swarm/ ;
# API : https://doc.traefik.io/traefik/reference/install-configuration/api-dashboard/ ;
# Traefik 2 : https://doc.traefik.io/traefik/v2.11/operations/api/
#
# Routeurs, services et intergiciels de démonstration : étiquettes de la pile lab-demo
# (stack/demo.yml). L'API est protégée par une authentification basique (compte glpi-lecture,
# empreinte htpasswd générée par stack/traefik/hook.sh) ; les étiquettes du routeur de l'API sont
# portées par le service traefik et lues par les deux versions.
# Ports : API Traefik 3 http://localhost:8145, Traefik 2 http://localhost:8146 ; entrée web de
# Traefik 3 http://localhost:8147 (en-tête Host: vitrine.lab.test).

services:
  traefik:
    image: ${LAB_TRAEFIK_IMAGE:-traefik:v3.7.19}
    command:
      - --api=true
      - --api.dashboard=true
      - --entrypoints.admin.address=:8080
      - --entrypoints.web.address=:80
      - --entrypoints.redis.address=:6379
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=lab-net
      - --log.level=INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - {target: 8080, published: 8145, protocol: tcp, mode: ingress}
      - {target: 80, published: 8147, protocol: tcp, mode: ingress}
    networks:
      lab-net:
        aliases: [traefik]
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        traefik.enable: "true"
        traefik.http.routers.api.rule: PathPrefix(`/api`) || PathPrefix(`/dashboard`)
        traefik.http.routers.api.entrypoints: admin
        traefik.http.routers.api.service: api@internal
        traefik.http.routers.api.middlewares: api-auth
        traefik.http.middlewares.api-auth.basicauth.users: "glpi-lecture:${LAB_TRAEFIK_GLPI_HASH:?empreinte absente, lancer ./lab up traefik}"
        # Port factice exigé par le fournisseur Swarm pour un service sans répartiteur propre.
        traefik.http.services.api-factice.loadbalancer.server.port: "9999"
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 96M
          cpus: "0.5"
        reservations:
          memory: 16M

  traefik2:
    image: ${LAB_TRAEFIK2_IMAGE:-traefik:v2.11.63}
    command:
      - --api=true
      - --api.dashboard=true
      - --entrypoints.admin.address=:8080
      - --entrypoints.web.address=:80
      - --entrypoints.redis.address=:6379
      - --providers.docker.swarmMode=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=lab-net
      - --log.level=INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - {target: 8080, published: 8146, protocol: tcp, mode: ingress}
    networks:
      lab-net:
        aliases: [traefik2]
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 96M
          cpus: "0.5"
        reservations:
          memory: 16M

networks:
  lab-net:
    external: true
