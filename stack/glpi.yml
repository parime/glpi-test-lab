# Brique « glpi » : UNE instance GLPI et sa base MariaDB.
# La commande `lab` déploie ce fichier une fois par instance déclarée dans instances.txt, sous le
# nom de pile lab-<instance> (par exemple lab-glpi12-a). Ne pas le déployer à la main : `lab` fournit
# les variables ci-dessous (instance, version, port, dossiers de données, mots de passe de .env).
#
# Données : trois volumes par instance (base, /var/glpi, plugins). Avec stack/glpi.bind.yml (mode
# par défaut, LAB_STORAGE=bind), ils sont posés dans F:\Dev\glpi-test-lab-data\<instance>\.
#
# Compatibilité avec les scripts de glpi-test-env : le conteneur GLPI porte l'étiquette
# lab.instance=<instance>, ce qui permet de le retrouver (`lab container <instance>`), et le dossier
# des plugins est un volume, pour qu'un redémarrage de la tâche par Swarm ne perde pas les plugins
# déployés par deploy-g12.sh.

services:
  db:
    image: ${LAB_MARIADB_IMAGE:-mariadb:11.8.9}
    command:
      - --innodb-use-native-aio=0
      - --innodb-buffer-pool-size=${LAB_DB_BUFFER_POOL:-128M}
      # Base de test : pas de synchronisation disque à chaque transaction (beaucoup plus rapide,
      # surtout sur un dossier de Windows) ; on accepte de perdre la dernière seconde en cas de panne.
      - --innodb-flush-log-at-trx-commit=0
      - --innodb-doublewrite=0
      - --innodb-file-per-table=0
      - --sync-binlog=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: "${LAB_DB_ROOT_PASSWORD:?mot de passe absent, lancer ./lab init}"
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: "${LAB_DB_PASSWORD:?mot de passe absent, lancer ./lab init}"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Swarm relance un conteneur « unhealthy » : sur un disque lent, la création de la base peut
      # durer plusieurs minutes, et une relance en plein milieu laisserait une base sans comptes.
      start_period: 30m
    labels:
      lab.instance: ${LAB_INSTANCE:?instance absente}
      lab.role: db
    networks: [default]
    deploy:
      labels:
        lab.brique: glpi
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: ${LAB_DB_MEMORY:-512M}

  glpi:
    image: glpi/glpi:${LAB_GLPI_VERSION:?version absente}
    environment:
      TIMEZONE: Europe/Paris
      GLPI_DB_HOST: db
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: ${LAB_DB_PASSWORD}
    volumes:
      - var:/var/glpi
      - plugins:/var/www/glpi/plugins
    ports:
      - target: 80
        published: ${LAB_PORT:?port absent}
        protocol: tcp
        mode: ingress
    labels:
      lab.instance: ${LAB_INSTANCE}
      lab.role: glpi
      lab.glpi-version: ${LAB_GLPI_VERSION}
    networks:
      default: {}
      lab-net:
        aliases:
          - ${LAB_INSTANCE}
    deploy:
      labels:
        lab.brique: glpi
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: ${LAB_GLPI_MEMORY:-1G}

volumes:
  db:
  var:
  plugins:

networks:
  default:
    driver: overlay
  lab-net:
    external: true
