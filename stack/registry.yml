# Brique « registry » : registre Docker de référence (registry:2, CNCF Distribution 2.8), avec
# authentification basique htpasswd, pour tester l'API Docker Registry v2 sans Harbor
# (GET /v2/, GET /v2/{dépôt}/tags/list).
# Documentation : https://distribution.github.io/distribution/about/configuration/ ;
# API : https://distribution.github.io/distribution/spec/api/
#
# Données : dépôts demo/nginx (plusieurs étiquettes) et demo/redis, copiés depuis Docker Hub par
# le crochet stack/registry/hook.sh ; compte glpi-lecture (htpasswd généré dans secrets/registry/).
# Interface : aucune ; API sur http://localhost:8135, depuis GLPI : http://docker-registry:5000.

services:
  registry:
    image: ${LAB_REGISTRY_IMAGE:-registry:2.8.3}
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registre du labo
      REGISTRY_AUTH_HTPASSWD_PATH: /run/secrets/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_SECRET: "${LAB_REGISTRY_HTTP_SECRET:?secret absent, lancer ./lab init}"
    secrets:
      - source: htpasswd
        target: htpasswd
    volumes:
      - data:/var/lib/registry
    ports:
      - target: 5000
        published: 8135
        protocol: tcp
        mode: ingress
    networks:
      default: {}
      lab-net:
        aliases: [docker-registry]
    deploy:
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 16M

secrets:
  htpasswd:
    name: lab-registry-htpasswd-${LAB_CONFIG_VERSION:-0}
    file: ${LAB_SECRETS_DIR:-../secrets}/registry/htpasswd

volumes:
  data:

networks:
  default:
    driver: overlay
  lab-net:
    external: true
