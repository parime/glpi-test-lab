# Brique « harbor » : registre Harbor 2.15 avec son analyseur Trivy, en services Swarm.
# Documentation : https://goharbor.io/docs/2.15.0/ ; API : https://github.com/goharbor/harbor/blob/v2.15.5/api/v2.0/swagger.yaml
#
# L'installateur officiel de Harbor génère une composition docker compose (install.sh, prepare).
# Swarm ne lance pas cet installateur : ce fichier en reprend les services et les réglages, avec
# les mêmes images officielles goharbor/* ; les fichiers de configuration sont dans stack/harbor/
# (adaptés des modèles de goharbor/harbor, licence Apache 2.0, make/photon/prepare/templates).
# Écarts avec l'installateur, pour le labo :
#   - pas de conteneur harbor-log (journaux sur la sortie standard, lus par `lab logs harbor`) ;
#   - 2 travailleurs de tâches au lieu de 10, 50 connexions PostgreSQL au lieu de 900 ;
#   - HTTP seulement, sur le port 8130 (interface et API sur http://localhost:8130).
#
# Adresse : EXT_ENDPOINT = http://localhost:8130, pour que le Docker du poste (et donc le Swarm)
# puisse tirer les images de Harbor sans réglage (localhost est un registre HTTP permis d'office).
# Depuis GLPI, Harbor est joint sur lab-net à http://harbor:8130 (même port) ; hôte du registre
# dans les références d'images : localhost:8130 (pile lab-demo-harbor).
#
# Secrets (clé de signature des jetons, clé de chiffrement, htpasswd du registre) : générés par
# stack/harbor/hook.sh dans secrets/harbor/ (hors dépôt). Mots de passe : .env (./lab init).
# Projet « demo », compte robot en lecture seule et images analysées : crochet seed.

x-harbor-env: &harbor-env
  CORE_SECRET: "${LAB_HARBOR_CORE_SECRET:?secret absent, lancer ./lab init}"
  JOBSERVICE_SECRET: "${LAB_HARBOR_JOBSERVICE_SECRET:?secret absent, lancer ./lab init}"
  REGISTRY_CREDENTIAL_USERNAME: harbor_registry_user
  REGISTRY_CREDENTIAL_PASSWORD: "${LAB_HARBOR_REGISTRY_PASSWORD:?mot de passe absent, lancer ./lab init}"
  NO_PROXY: redis,registry,core,registryctl,postgresql,portal,jobservice,trivy-adapter,proxy,localhost,127.0.0.1
  HARBOR_ALLOW_PRIVATE_NETWORK_ACCESS: "true"
  LOG_LEVEL: info

x-restart: &restart
  condition: any
  delay: 10s

services:
  postgresql:
    image: goharbor/harbor-db:${LAB_HARBOR_VERSION:-v2.15.5}
    environment:
      POSTGRES_PASSWORD: "${LAB_HARBOR_DB_PASSWORD:?mot de passe absent, lancer ./lab init}"
    volumes:
      - database:/var/lib/postgresql/data
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728
    healthcheck:
      start_period: 30m
    stop_grace_period: 1m
    deploy:
      restart_policy: *restart
      resources:
        limits:
          memory: 320M
          cpus: "1"
        reservations:
          memory: 64M

  redis:
    image: goharbor/redis-photon:${LAB_HARBOR_VERSION:-v2.15.5}
    volumes:
      - redis:/var/lib/redis
    healthcheck:
      start_period: 15m
    deploy:
      restart_policy: *restart
      resources:
        limits:
          memory: 96M
          cpus: "0.5"
        reservations:
          memory: 16M

  registry:
    image: goharbor/registry-photon:${LAB_HARBOR_VERSION:-v2.15.5}
    environment:
      REGISTRY_HTTP_SECRET: "${LAB_HARBOR_REGISTRY_HTTP_SECRET:?secret absent, lancer ./lab init}"
    configs:
      - source: registry
        target: /etc/registry/config.yml
    secrets:
      - source: registry_passwd
        target: /etc/registry/passwd
      - source: token_cert
        target: /etc/registry/root.crt
    volumes:
      - registry:/storage
    healthcheck:
      start_period: 15m
    deploy:
      restart_policy: *restart
      resources:
        limits:
          memory: 192M
          cpus: "1"
        reservations:
          memory: 24M

  registryctl:
    image: goharbor/harbor-registryctl:${LAB_HARBOR_VERSION:-v2.15.5}
    environment:
      <<: *harbor-env
      REGISTRY_HTTP_SECRET: "${LAB_HARBOR_REGISTRY_HTTP_SECRET}"
    configs:
      - source: registry
        target: /etc/registry/config.yml
      - source: registryctl
        target: /etc/registryctl/config.yml
    secrets:
      - source: registry_passwd
        target: /etc/registry/passwd
    volumes:
      - registry:/storage
    healthcheck:
      start_period: 15m
    deploy:
      restart_policy: *restart
      resources:
        limits:
          memory: 96M
          cpus: "0.5"
        reservations:
          memory: 16M

  core:
    image: goharbor/harbor-core:${LAB_HARBOR_VERSION:-v2.15.5}
    environment:
      <<: *harbor-env
      CONFIG_PATH: /etc/core/app.conf
      _REDIS_URL_CORE: redis://redis:6379?idle_timeout_seconds=30
      _REDIS_URL_REG: redis://redis:6379/1?idle_timeout_seconds=30
      SYNC_QUOTA: "true"
      EXT_ENDPOINT: http://localhost:8130
      DATABASE_TYPE: postgresql
      POSTGRESQL_HOST: postgresql
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: "${LAB_HARBOR_DB_PASSWORD}"
      POSTGRESQL_DATABASE: registry
      POSTGRESQL_SSLMODE: disable
      POSTGRESQL_MAX_IDLE_CONNS: "10"
      POSTGRESQL_MAX_OPEN_CONNS: "50"
      POSTGRESQL_CONN_MAX_LIFETIME: 5m
      POSTGRESQL_CONN_MAX_IDLE_TIME: "0"
      REGISTRY_URL: http://registry:5000
      PORTAL_URL: http://portal:8080
      TOKEN_SERVICE_URL: http://core:8080/service/token
      HARBOR_ADMIN_PASSWORD: "${LAB_HARBOR_ADMIN_PASSWORD:?mot de passe absent, lancer ./lab init}"
      MAX_JOB_WORKERS: "2"
      WITH_TRIVY: "true"
      CORE_URL: http://core:8080
      CORE_LOCAL_URL: http://127.0.0.1:8080
      JOBSERVICE_URL: http://jobservice:8080
      TRIVY_ADAPTER_URL: http://trivy-adapter:8080
      REGISTRY_STORAGE_PROVIDER_NAME: filesystem
      READ_ONLY: "false"
      REGISTRY_CONTROLLER_URL: http://registryctl:8080
      CSRF_KEY: "${LAB_HARBOR_CSRF_SECRET:?secret absent, lancer ./lab init}"
      ROBOT_SCANNER_NAME_PREFIX: labtrivy
      PERMITTED_REGISTRY_TYPES_FOR_PROXY_CACHE: docker-hub,harbor,docker-registry,github-ghcr
      QUOTA_UPDATE_PROVIDER: db
      PORT: "8080"
    configs:
      - source: core_app
        target: /etc/core/app.conf
    secrets:
      - source: token_key
        target: /etc/core/private_key.pem
      - source: secretkey
        target: /etc/core/key
    healthcheck:
      start_period: 30m
    deploy:
      restart_policy: *restart
      resources:
        limits:
          memory: 320M
          cpus: "1"
        reservations:
          memory: 48M

  portal:
    image: goharbor/harbor-portal:${LAB_HARBOR_VERSION:-v2.15.5}
    configs:
      - source: portal
        target: /etc/nginx/nginx.conf
    healthcheck:
      start_period: 15m
    deploy:
      restart_policy: *restart
      resources:
        limits:
          memory: 48M
          cpus: "0.25"
        reservations:
          memory: 8M

  jobservice:
    image: goharbor/harbor-jobservice:${LAB_HARBOR_VERSION:-v2.15.5}
    environment:
      <<: *harbor-env
      REGISTRY_URL: http://registry:5000
      CORE_URL: http://core:8080
      REGISTRY_CONTROLLER_URL: http://registryctl:8080
      JOBSERVICE_WEBHOOK_JOB_MAX_RETRY: "3"
      JOBSERVICE_WEBHOOK_JOB_HTTP_CLIENT_TIMEOUT: "3"
    configs:
      - source: jobservice
        target: /etc/jobservice/config.yml
    volumes:
      - job_logs:/var/log/jobs
    healthcheck:
      start_period: 30m
    deploy:
      restart_policy: *restart
      resources:
        limits:
          memory: 192M
          cpus: "0.5"
        reservations:
          memory: 24M

  trivy-adapter:
    image: goharbor/trivy-adapter-photon:${LAB_HARBOR_VERSION:-v2.15.5}
    environment:
      SCANNER_LOG_LEVEL: info
      SCANNER_REDIS_URL: redis://redis:6379/5?idle_timeout_seconds=30
      SCANNER_STORE_REDIS_URL: redis://redis:6379/5?idle_timeout_seconds=30
      SCANNER_STORE_REDIS_NAMESPACE: harbor.scanner.trivy:store
      SCANNER_JOB_QUEUE_REDIS_URL: redis://redis:6379/5?idle_timeout_seconds=30
      SCANNER_JOB_QUEUE_REDIS_NAMESPACE: harbor.scanner.trivy:job-queue
      SCANNER_TRIVY_CACHE_DIR: /home/scanner/.cache/trivy
      SCANNER_TRIVY_REPORTS_DIR: /home/scanner/.cache/reports
      SCANNER_TRIVY_VULN_TYPE: os,library
      SCANNER_TRIVY_SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      SCANNER_TRIVY_IGNORE_UNFIXED: "false"
      SCANNER_TRIVY_SKIP_UPDATE: "false"
      SCANNER_TRIVY_SKIP_JAVA_DB_UPDATE: "false"
      SCANNER_TRIVY_OFFLINE_SCAN: "false"
      SCANNER_TRIVY_SECURITY_CHECKS: vuln
      SCANNER_TRIVY_INSECURE: "false"
      # Disque F: lent : analyse et téléchargement de la base Trivy peuvent être longs.
      SCANNER_TRIVY_TIMEOUT: 20m0s
      NO_PROXY: redis,registry,core,registryctl,postgresql,portal,jobservice,trivy-adapter,proxy,localhost,127.0.0.1
    volumes:
      - trivy:/home/scanner/.cache/trivy
      - trivy_reports:/home/scanner/.cache/reports
    healthcheck:
      start_period: 15m
    deploy:
      restart_policy: *restart
      resources:
        # La base Trivy est chargée en mémoire pendant une analyse.
        limits:
          memory: 768M
          cpus: "1"
        reservations:
          memory: 64M

  proxy:
    image: goharbor/nginx-photon:${LAB_HARBOR_VERSION:-v2.15.5}
    configs:
      - source: proxy
        target: /etc/nginx/nginx.conf
    ports:
      - target: 8130
        published: 8130
        protocol: tcp
        mode: ingress
    networks:
      default: {}
      lab-net:
        aliases: [harbor]
    healthcheck:
      start_period: 15m
    deploy:
      restart_policy: *restart
      resources:
        limits:
          memory: 48M
          cpus: "0.5"
        reservations:
          memory: 8M

configs:
  core_app:
    name: lab-harbor-core-app-${LAB_CONFIG_VERSION:-0}
    file: ./harbor/core-app.conf
  registry:
    name: lab-harbor-registry-${LAB_CONFIG_VERSION:-0}
    file: ./harbor/registry.yml
  registryctl:
    name: lab-harbor-registryctl-${LAB_CONFIG_VERSION:-0}
    file: ./harbor/registryctl.yml
  jobservice:
    name: lab-harbor-jobservice-${LAB_CONFIG_VERSION:-0}
    file: ./harbor/jobservice.yml
  portal:
    name: lab-harbor-portal-${LAB_CONFIG_VERSION:-0}
    file: ./harbor/portal-nginx.conf
  proxy:
    name: lab-harbor-proxy-${LAB_CONFIG_VERSION:-0}
    file: ./harbor/proxy-nginx.conf

secrets:
  token_key:
    name: lab-harbor-token-key-${LAB_CONFIG_VERSION:-0}
    file: ${LAB_SECRETS_DIR:-../secrets}/harbor/private_key.pem
  token_cert:
    name: lab-harbor-token-cert-${LAB_CONFIG_VERSION:-0}
    file: ${LAB_SECRETS_DIR:-../secrets}/harbor/root.crt
  secretkey:
    name: lab-harbor-secretkey-${LAB_CONFIG_VERSION:-0}
    file: ${LAB_SECRETS_DIR:-../secrets}/harbor/secretkey
  registry_passwd:
    name: lab-harbor-registry-passwd-${LAB_CONFIG_VERSION:-0}
    file: ${LAB_SECRETS_DIR:-../secrets}/harbor/registry_passwd

volumes:
  database:
  redis:
  registry:
  job_logs:
  trivy:
  trivy_reports:

networks:
  default:
    driver: overlay
  lab-net:
    external: true
